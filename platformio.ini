; ESP32-C3 + SIM800 relay (JAR replacement)
; PlatformIO project. Build: pio run -t upload  (COM23 = native USB ESP32-C3)
[platformio]
src_dir = .
src_filter = +<*> -<.git> -<backup>

[env:esp32-c3-devkitm-1]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM23
upload_speed = 460800
upload_flags =
    --no-stub
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets@2.4.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

; TTGO T-Call v1.3 / v1.4 (ESP32 classic + SIM800L/H).
; Pins/UART are set in boards.h via -DBOARD_T_CALL=1.
[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets@2.4.1
build_flags =
    -DBOARD_T_CALL=1
    -DCORE_DEBUG_LEVEL=3